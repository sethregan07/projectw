version: '3.8'

services:
  # API Gateway - Entry point for all services
  api-gateway:
    build:
      context: ../microservices/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - GHOST_SERVICE_URL=http://ghost-service:2368
    networks:
      - microservices-network
    depends_on:
      - auth-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Authentication Service
  auth-service:
    build:
      context: ../microservices/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=database-service
      - DB_PORT=5432
      - DB_NAME=auth
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=your_secure_jwt_secret_here
      - JWT_EXPIRY=24h
    networks:
      - microservices-network
    depends_on:
      - database-service
    volumes:
      - ../microservices/auth-service/logs:/usr/src/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Database Service (PostgreSQL)
  database-service:
    image: postgres:15-alpine
    container_name: database-service
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Ghost CMS Service (SQLite instead of PostgreSQL)
  ghost-service:
    image: ghost:5-alpine
    container_name: ghost-service
    restart: unless-stopped
    environment:
      - database__client=sqlite3
      - database__connection__filename=/var/lib/ghost/content/data/ghost.db
      - url=http://localhost:2368
    networks:
      - microservices-network
    volumes:
      - ghost_content:/var/lib/ghost/content
    ports:
      - "2368:2368"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2368/ghost/api/v3/admin/site/"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - database-service
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

networks:
  microservices-network:
    driver: bridge
    name: microservices-network

volumes:
  postgres_data:
    driver: local
  ghost_content:
    driver: local
